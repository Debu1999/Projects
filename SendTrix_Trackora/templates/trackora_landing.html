{% extends "base.html" %}

{% block content %}
<style>
.track-grid {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.track-card {
    flex: 1;
    min-width: 220px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    text-decoration: none;
    color: inherit;
}

.track-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.track-card.disabled {
    cursor: not-allowed;
    opacity: 0.55;
    pointer-events: none;
}

.track-icon {
    font-size: 32px;
    margin-bottom: 10px;
}

.track-title {
    font-size: 18px;
    font-weight: 600;
    color: #1F4E78;
    margin-bottom: 6px;
}

.track-desc {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 12px;
}

.track-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
}

.track-badge.active { background: #dcfce7; color: #166534; }
.track-badge.soon { background: #f3f4f6; color: #6b7280; }
</style>

<div class="page-title">Trackora</div>

<div class="track-grid">
    <a href="{{ url_for('applications_cots') }}" class="track-card">
        <div class="track-icon">📦</div>
        <div class="track-title">COTS</div>
        <div class="track-desc">Commercial off-the-shelf asset compliance tracking</div>
        <span class="track-badge active">Active</span>
    </a>

    <div class="track-card disabled">
        <div class="track-icon">🖥️</div>
        <div class="track-title">Server</div>
        <div class="track-desc">Server inventory & compliance tracking</div>
        <span class="track-badge soon">Coming Soon</span>
    </div>

    <div class="track-card disabled">
        <div class="track-icon">🍪</div>
        <div class="track-title">OneTrust</div>
        <div class="track-desc">Cookie consent & vendor compliance</div>
        <span class="track-badge soon">Coming Soon</span>
    </div>
</div>
{% endblock %}
